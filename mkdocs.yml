site_name: Systems Platform and Intelligence Lab
site_description: Documentation for the sprc compute cluster — logging in, running jobs on SLURM, storage, and sharing the GPUs fairly.
site_url: http://sprlab005.csl.illinois.edu/

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link

nav:
  - Home: index.md
  - Start here:
      - Accounts & access: accounts.md
      - Running jobs: running-jobs.md
      - Command reference: cheatsheet.md
  - Scheduling policy:
      - Priority, capacity & fair sharing: priority.md
  - Course students:
      - Course workflow: coursework.md
  - Storage & files:
      - Storage: storage.md
      - Workflows & file management: workflows.md
  - Tools:
      - Sprocket portal: portal.md
      - VS Code: vscode.md
      - Agentic coding helper: agentic-helper.md
  - FAQ: faq.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets

plugins:
  - search
