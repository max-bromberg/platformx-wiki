site_name: Systems Platform and Intelligence Lab
site_description: Documentation for the sprc compute cluster — logging in, running jobs, storage, and the SLURM transition.
site_url: http://sprlab005.csl.illinois.edu/

theme:
  name: material
  custom_dir: overrides   # enables overrides/main.html (announcement bar -> /dashboard)
  palette:
    - scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

nav:
  - Home: index.md
  - Migrate your data: storage-migration.md
  - Running jobs:
      - running-jobs.md
      - Command reference: cheatsheet.md
      - VS Code: vscode.md
  - FAQ: faq.md
  - About the transition: slurm-transition.md
  - Sysadmin reference:
      - admins/index.md
      - New user provisioning: admins/provisioning-new-users.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets

plugins:
  - search
